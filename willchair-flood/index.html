<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%rescue-icon.svg" />
    <meta name="theme-color" content="#183249" />
    <meta name="description" content="휠체어 사용자를 위한 위치 수신·사용자 선택 위치 공유 및 구명조끼 보관함 상태 시뮬레이션 프로토타입" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WILLCHAIR RESCUE | 긴급 위치 확인과 공유</title>
    <style>
      .emergency-fallback { position: fixed; bottom: 0; left: 0; right: 0; z-index: 3000; display: flex; justify-content: center; align-items: center; gap: 14px; padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: #fff8f5; border-top: 1px solid #e4c6bc; color: #6b443a; font: 12px/1.6 system-ui,sans-serif; }
      .emergency-fallback a { display: inline-block; flex-shrink: 0; padding: 12px 18px; min-height: 44px; border: 1px solid #9b4534; border-radius: 6px; background: #fff; color: #8b3527; font-size: 16px; font-weight: 700; text-decoration: none; }
      .emergency-fallback a:focus-visible { outline: 3px solid #087f83; outline-offset: 3px; }
      .emergency-fallback span { max-width: 420px; }
      @media(max-width:420px) { .emergency-fallback { gap: 10px; font-size: 10px; } .emergency-fallback a { padding: 10px 12px; font-size: 14px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <aside class="emergency-fallback" aria-label="앱 오류 시에도 이용할 수 있는 긴급 전화 안내">
      <a href="tel:119">119 전화 연결</a>
      <span>전화 앱을 엽니다. 자동 구조 요청이나 신고 접수 완료가 아닙니다. 앱 오류 시에도 이 안내를 확인할 수 있습니다.</span>
    </aside>
    <noscript>이 서비스의 위치 수신과 공유에는 JavaScript가 필요합니다. 필요하면 위의 119 전화 연결을 이용하세요.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
